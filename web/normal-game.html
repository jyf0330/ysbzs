<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>元素背包史 · 正常游戏</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="normal-game.css" />
</head>
<body>
  <main class="normal-shell" data-scene="route">
    <header class="normal-topbar">
      <section>
        <div class="eyebrow">元素背包史 / Normal Game</div>
        <h1>正常游戏流程</h1>
      </section>
      <section class="run-tools" aria-label="本局工具">
        <label>
          <span>Seed</span>
          <input id="seed-input" type="text" value="normal-seed-001" autocomplete="off" />
        </label>
        <button id="save-run-btn" type="button">保存</button>
        <button id="load-run-btn" type="button">读取</button>
        <button id="restart-run-btn" type="button">重开本局</button>
        <button id="seed-check-btn" type="button">规则自测</button>
        <small id="run-tool-status">未保存</small>
      </section>
      <section class="status-line" aria-label="当前状态">
        <span>阶段 <strong id="phase-label">加载中</strong></span>
        <span>第 <strong id="day-label">-</strong> 天</span>
        <span>金币 <strong id="gold-label">0</strong></span>
        <span id="next-label">读取中</span>
      </section>
    </header>

    <section id="route-scene" class="scene route-scene" data-scene-name="route" data-active="true">
      <section class="scene-main">
        <div class="scene-title">
          <span id="route-node-kicker">3 选 1</span>
          <h2 id="route-node-title">时间节点 1</h2>
          <p id="route-summary">选择路线、遭遇或奖励。这里是战斗前决策界面。</p>
        </div>
        <div id="route-choice-list" class="choice-grid" aria-label="三选一选项"></div>
      </section>
      <aside class="roster-board" aria-label="路线界面阵容调整">
        <div class="roster-head">
          <h2>阵容调整</h2>
          <span id="route-roster-count">0/0</span>
        </div>
        <div class="roster-columns">
          <section>
            <h3>上阵</h3>
            <div id="route-active-list" class="roster-list"></div>
          </section>
          <section>
            <h3>背包</h3>
            <div id="route-bench-list" class="roster-list"></div>
          </section>
        </div>
      </aside>
    </section>

    <section id="shop-scene" class="scene shop-scene" data-scene-name="shop" data-active="false">
      <section class="scene-main">
        <div class="scene-title">
          <span>Shop</span>
          <h2>商店</h2>
          <p id="shop-summary">购买宠物，整理阵容后继续路线。</p>
        </div>
        <div id="shop-choice-list" class="choice-grid" aria-label="商店宠物"></div>
        <div id="shop-action-list" class="shop-actions" aria-label="商店操作"></div>
      </section>
      <aside class="roster-board" aria-label="商店界面阵容调整">
        <div class="roster-head">
          <h2>阵容调整</h2>
          <span id="shop-roster-count">0/0</span>
        </div>
        <div class="roster-columns">
          <section>
            <h3>上阵</h3>
            <div id="shop-active-list" class="roster-list"></div>
          </section>
          <section>
            <h3>背包</h3>
            <div id="shop-bench-list" class="roster-list"></div>
          </section>
        </div>
      </aside>
    </section>

    <section id="battle-scene" class="scene battle-scene" data-scene-name="battle" data-active="false">
      <aside class="combat-side">
        <h2>我方</h2>
        <div id="battle-hero-list" class="combat-list"></div>
      </aside>
      <section class="battle-core">
        <div class="scene-title compact">
          <span>Battle</span>
          <h2>游戏界面</h2>
          <p>这里只保留棋盘、回合按钮和战斗反馈。</p>
        </div>
        <div id="battle-board" class="battle-board" aria-label="战斗棋盘"></div>
        <div class="battle-actions">
          <button id="auto-position-btn" type="button">智能调整站位</button>
          <button id="all-out-btn" type="button">我方全部出击</button>
        </div>
      </section>
      <aside class="combat-side enemy">
        <h2>敌方</h2>
        <div id="battle-enemy-list" class="combat-list"></div>
        <pre id="battle-log" class="battle-log">暂无战斗记录。</pre>
      </aside>
    </section>
  </main>

  <div id="toast" class="toast" hidden aria-live="polite"></div>
  <script src="js/local-engine.js"></script>
  <script type="module" src="normal-game.js"></script>
</body>
</html>
